# 百度网盘官方客户端 · 网页桌面版（KasmVNC）— QNAP Container Station 粘贴即用
# 浏览器里直接操作官方客户端界面：扫码登录、点选文件下载，落盘到 NAS 共享目录。
# （命令行多线程版见 baidudl-compose.yml；本版胜在操作友好+官方客户端兼容性）
#
# 免配置：config 用命名卷自动创建；/share 整体挂入容器，
# 下载位置在客户端界面里选（见下），YAML 无需改任何路径。
#
# 部署后：
#   1. 用 Chrome/Edge 打开 http://<NAS的IP>:8280 （KasmVNC 对 Firefox 支持差）
#   2. 浏览器里就是百度网盘客户端界面 → 扫码登录
#   3. 【重要】客户端右上角 设置 → 传输 → 下载目录 → 浏览
#      选一个 /share/... 下的目录（就是 File Station 里看到的共享文件夹）
#   4. 以后下载的文件直接落在该共享目录，File Station 即可见
#   注意：仅限内网使用，绝不在路由器上暴露 8280/8281。
services:
  baidunetdisk:
    # 镜像源：1ms.run；备选 docker.xuanyuan.me/、官方 docker.io/
    image: docker.1ms.run/yucatovo/baidunetdisk-docker:latest
    container_name: baidunetdisk
    restart: unless-stopped
    # 上游镜像建议：避免 file descriptor 相关报错
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      # root 身份运行，保证能写 /share 下任意共享目录（File Station 以 admin 可管理）
      - PUID=0
      - PGID=0
      # 需要给网页加密码时取消注释（默认用户名 abc）
      # - PASSWORD=改成你的密码
    ports:
      - "8280:8080"   # 浏览器访问（HTTP）
      - "8281:8181"   # HTTPS 备用（无损模式）
    volumes:
      # 客户端配置/登录态持久化：命名卷，Docker 自动创建
      - baidunetdisk-config:/config
      # 整个 /share 挂入容器 → 下载目录在客户端界面里自由选择，无需改 YAML
      - /share:/share

volumes:
  baidunetdisk-config:
