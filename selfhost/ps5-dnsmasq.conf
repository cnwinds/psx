# PS5 exploit host DNS（dnsmasq）
# 192.168.1.250 是示例 IP：与 docker-compose.yml 里容器的 ipv4_address 保持一致。

# 不读 /etc/resolv.conf，上游固定为国内 DNS（按自己网络环境调整）
no-resolv
server=223.5.5.5
server=119.29.29.29

# 只转发完整域名，缓存 1000 条
domain-needed
cache-size=1000

# 接管用户指南入口（PS5 端：设置 → 网络 → 手动 DNS，首选填容器 IP）
local=/manuals.playstation.net/
address=/manuals.playstation.net/192.168.1.250

# 更新屏蔽：返回 NXDOMAIN（address 值留空即 NXDOMAIN，勿写 "#"）
# PS5 想检查/下载固件更新时直接解析失败，防手滑升级
# 索尼全系域名 NXDOMAIN（update/PSN/遥测/上报），manuals 劫持按最长匹配优先保留
address=/playstation.net/
address=/playstation.com/
address=/sonyentertainmentnetwork.com/
address=/sony.com/
address=/sony.net/
address=/psn.com/
address=/scea.com/
address=/sonyinteractive.com/
