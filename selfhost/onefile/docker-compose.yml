# PS5 Relapse All-in-One — 单文件部署 · Bridge 版（QNAP Container Station 粘贴即用）
# 使用方法见 selfhost/onefile/README.md。
# 前提：github.com/cnwinds/psx 仓库保持 public（站点全部内容来自它的 tarball）。
#
# 这是主推版本：不依赖 macvlan（QNAP 上常因 eth0 被系统占用而报
# "failed to create the macvlan port: device or resource busy"），
# 只需 NAS 的 UDP/53 端口和 HTTP 端口（默认映射到 8010）空闲。
#
# >>> 部署后 PS5 侧 <<<
#   - 网络 → 手动 DNS：首选填 NAS 的内网 IP（不是 192.168.1.250！就是 NAS 自己的 IP），备用留空
#   - 浏览器打开 http://<NAS的IP>:8010/ 即 all-in-one 页面
#   - 更新屏蔽照常生效（DNS 在本容器）
#
# 可改参数：
#   - "8010:80" 左边是 NAS 上对外暴露的 HTTP 端口，与 QTS(8080)等冲突时改掉
#   - GH_PROXY：GitHub 直连慢/失败时填加速前缀（以 / 结尾），如 https://gh-proxy.com/
services:
  ps5-host:
    # 镜像源：daocloud（用户 NAS 实测可拉）；备选 docker.xuanyuan.me / docker.1ms.run
    image: docker.m.daocloud.io/library/alpine:3.20
    container_name: ps5-host
    restart: unless-stopped
    environment:
      # GitHub 下载加速前缀（以 / 结尾）。国内网络直连 GitHub 常见卡死，默认走加速。
      # 加速站失效可换 https://ghproxy.net/ 或改为空串=直连。
      - GH_PROXY=https://gh-proxy.com/
    ports:
      - "8010:80"
      # ↓↓ 更新屏蔽（可选）：本配置只需 UDP 53（无 DNSSEC/大响应，不依赖 TCP）。
      #   取消 UDP 那行注释即启用；NAS 的 53/udp 也被占时报
      #   "bind: address already in use"，处理办法见 README「常见问题」。
      #   TCP 53 一般不需要，保留注释即可。
      # - "53:53/udp"
      # - "53:53/tcp"
    command:
      - sh
      - -c
      - |
        set -e
        # ---- PS5 all-in-one host（bridge 版：DNS 屏蔽更新 + HTTP 站点）----
        apk add -U dnsmasq nginx curl >/dev/null || { sed -i 's#dl-cdn.alpinelinux.org#mirrors.ustc.edu.cn#g' /etc/apk/repositories; apk add -U dnsmasq nginx curl >/dev/null; }

        # ---- 站点：首启从公共仓库下载完整内容（页面 + 漏洞链 + payload 一步到位）----
        # 先下到文件再解压；GH_PROXY 有值时走加速，失败自动回退直连；总超时防挂死。
        if [ ! -f /srv/www/.site-ready ]; then
        echo "ps5-host: downloading all-in-one site (first boot)..."
        mkdir -p /srv/www
        SITE_URL=https://github.com/cnwinds/psx/archive/refs/heads/main.tar.gz
        fetch_site() {
        curl -fL --retry 2 --connect-timeout 10 --max-time 300 -o /tmp/site.tgz "$$1" && tar -xz -C /srv/www --strip-components=1 -f /tmp/site.tgz
        }
        if [ -n "$$GH_PROXY" ]; then
        fetch_site "$$GH_PROXY$$SITE_URL" || fetch_site "$$SITE_URL"
        else
        fetch_site "$$SITE_URL"
        fi
        rm -f /tmp/site.tgz
        touch /srv/www/.site-ready
        echo "ps5-host: site ready (page + exploit + payloads)"
        fi

        # ---- DNS：NXDOMAIN 屏蔽索尼更新（bridge 版不接管用户指南入口）----
        # 注：下面 heredoc 内容按 shell 语义需要顶格（勿加缩进）
        cat > /etc/ps5-dnsmasq.conf <<DNS_EOF
        no-resolv
        server=223.5.5.5
        server=119.29.29.29
        domain-needed
        cache-size=1000
        address=/ps5.update.playstation.net/
        address=/ps4.update.playstation.net/
        address=/feu01.ps4.update.playstation.net/
        DNS_EOF

        # ---- HTTP：静态站（PS5 浏览器直接访问 http://<NAS IP>:8010/）----
        cat > /etc/nginx/http.d/default.conf <<'NGINX_EOF'
        server {
        listen 80 default_server;
        location /document { return 302 /; }
        location / { root /srv/www; index index.html; try_files $$uri $$uri/ /index.html; }
        }
        NGINX_EOF

        dnsmasq --test -C /etc/ps5-dnsmasq.conf
        dnsmasq --no-daemon -C /etc/ps5-dnsmasq.conf &
        echo "ps5-host: all services up — HTTP 8010 (DNS update-block ready; enable 53 port mapping to activate)"
        exec nginx -g "daemon off;"
    volumes:
      - ps5-www:/srv/www

volumes:
  ps5-www:
