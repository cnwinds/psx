# PS5 Relapse All-in-One — 单文件部署（QNAP Container Station 直接粘贴即可，无需 SSH）
# 使用方法见 selfhost/onefile/README.md。
# 前提：github.com/cnwinds/psx 仓库保持 public（站点全部内容来自它的 tarball）。
#
# >>> 只需修改下面 4 处网络参数 <<<
#   1. parent:      网卡名，先用 eth0；报 invalid subinterface 就换 eth1 / ovs_eth0
#                   （QTS「网络与虚拟交换机 → 接口」里能看到 Linux 网卡名）
#   2. subnet:      你的网段
#   3. gateway:     你的网关
#   4. ipv4_address: 给容器的固定 IP（与网段一致，避开已占用地址）
#
# 注：脚本里的 shell 变量一律写成 $$（compose 会把单个 $ 当作自己的变量替换掉）。
services:
  ps5-host:
    # 镜像源：daocloud（用户 NAS 实测可拉）
    # 若报 denied/pull 失败，备选：docker.xuanyuan.me / docker.1ms.run（均实测匿名可拉）
    image: docker.m.daocloud.io/library/alpine:3.20
    container_name: ps5-host
    restart: unless-stopped
    environment:
      # GitHub 直连慢/失败时填镜像加速前缀（必须以 / 结尾），如：
      # - GH_PROXY=https://gh-proxy.com/
      - GH_PROXY=
    command:
      - sh
      - -c
      - |
        set -e
        # ---- PS5 all-in-one host（单文件版，无需 NAS 上的任何本地文件）----
        # 容器 DNS 直接钉公共上游，绕开 docker 内嵌 DNS/宿主解析器的不确定性
        echo 'nameserver 223.5.5.5' > /etc/resolv.conf
        echo 'nameserver 119.29.29.29' >> /etc/resolv.conf
        # apk 源依次重试（国内源优先），失败显式 FATAL（busybox 的 set -e 会吞 OR 兜底块的退出码）
        PKGS="dnsmasq nginx openssl curl"
        for m in mirrors.ustc.edu.cn mirrors.tuna.tsinghua.edu.cn mirrors.aliyun.com dl-cdn.alpinelinux.org; do
        echo "https://$$m/alpine/v3.20/main" > /etc/apk/repositories
        echo "https://$$m/alpine/v3.20/community" >> /etc/apk/repositories
        echo "ps5-host: apk via $$m"
        apk add -U $$PKGS >/dev/null 2>&1 && break
        done
        command -v nginx >/dev/null && command -v dnsmasq >/dev/null && command -v curl >/dev/null || { echo "ps5-host: FATAL all apk mirrors failed"; exit 1; }

        LAN_IP=$$(ip -4 addr show dev eth0 | awk '/inet /{split($$2,a,"/"); print a[1]; exit}')
        echo "ps5-host: container IP = $$LAN_IP (PS5 首选 DNS 填这个，备用留空)"

        # ---- 站点：首启从公共仓库下载完整内容（页面 + 漏洞链 + payload 一步到位）----
        if [ ! -f /srv/www/.site-ready ]; then
        echo "ps5-host: downloading all-in-one site (first boot)..."
        mkdir -p /srv/www
        curl -fsSL --retry 3 --connect-timeout 15 "$${GH_PROXY}https://github.com/cnwinds/psx/archive/refs/heads/main.tar.gz" | tar -xz -C /srv/www --strip-components=1
        touch /srv/www/.site-ready
        echo "ps5-host: site ready (page + exploit + payloads)"
        fi

        # ---- 自签证书（SAN 必须有；剩余不足 7 天才重建）----
        mkdir -p /srv/certs
        if [ ! -s /srv/certs/cert.pem ] || [ ! -s /srv/certs/key.pem ] || ! openssl x509 -checkend 604800 -noout -in /srv/certs/cert.pem >/dev/null 2>&1; then
        openssl req -x509 -newkey rsa:2048 -nodes -days 365 -keyout /srv/certs/key.pem -out /srv/certs/cert.pem -subj '/CN=manuals.playstation.net' -addext 'subjectAltName=DNS:manuals.playstation.net'
        echo "ps5-host: generated new certificate (365 days)"
        fi

        # ---- DNS：接管用户指南入口 + NXDOMAIN 屏蔽更新 ----
        # 注：下面 heredoc 内容按 shell 语义需要顶格（勿加缩进）
        cat > /etc/ps5-dnsmasq.conf <<DNS_EOF
        no-resolv
        server=223.5.5.5
        server=119.29.29.29
        domain-needed
        cache-size=1000
        local=/manuals.playstation.net/
        address=/manuals.playstation.net/$$LAN_IP
        address=/ps5.update.playstation.net/
        address=/ps4.update.playstation.net/
        address=/feu01.ps4.update.playstation.net/
        DNS_EOF

        cat > /etc/nginx/http.d/default.conf <<'NGINX_EOF'
        server {
        listen 80 default_server;
        location /document { return 302 /; }
        location / { root /srv/www; index index.html; try_files $$uri $$uri/ /index.html; }
        }
        server {
        listen 443 ssl default_server;
        ssl_certificate     /srv/certs/cert.pem;
        ssl_certificate_key /srv/certs/key.pem;
        location /document { return 302 /; }
        location / { root /srv/www; index index.html; try_files $$uri $$uri/ /index.html; }
        }
        NGINX_EOF

        dnsmasq --test -C /etc/ps5-dnsmasq.conf
        dnsmasq --no-daemon -C /etc/ps5-dnsmasq.conf &
        echo "ps5-host: all services up — DNS 53 / HTTP 80 / HTTPS 443"
        exec nginx -g "daemon off;"
    networks:
      lan:
        ipv4_address: 192.168.1.250
    volumes:
      - ps5-certs:/srv/certs
      - ps5-www:/srv/www

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

volumes:
  ps5-certs:
  ps5-www:
